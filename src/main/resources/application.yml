spring:
  application:
    name: anomaly-detection

  # Oracle Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:anomaly}
    password: ${SPRING_DATASOURCE_PASSWORD:anomaly_pass}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000

  # Liquibase schema migration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Kafka (Amazon MSK compatible)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: anomaly-detection
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 3
      ack-mode: manual

server:
  port: 8080

# Risk scoring configuration
risk:
  alert-threshold: 30.0
  block-threshold: 70.0
  ewma-alpha: 0.01
  min-profile-txns: 20
  breadth-multiplier-pct: 0.03
  rule-cache-refresh-seconds: 60

  transaction-types:
    - NEFT
    - RTGS
    - IMPS
    - UPI
    - IFT

  rule-defaults:
    amount-anomaly-variance-pct: 100.0
    amount-per-type-variance-pct: 150.0
    min-type-samples: 10
    hourly-amount-variance-pct: 80.0
    tps-spike-variance-pct: 50.0
    min-type-frequency-pct: 5.0
    min-repeat-count: 5
    beneficiary-concentration-variance-pct: 200.0
    min-distinct-beneficiaries: 5
    abs-min-concentration-pct: 5.0
    min-beneficiary-txns: 3
    max-cv-pct: 10.0
    isolation-forest-threshold: 60.0
    daily-cumulative-variance-pct: 150.0
    daily-cumulative-min-days: 3
    new-bene-max-per-day: 5
    new-bene-variance-pct: 200.0
    new-bene-min-profile-days: 3
    dormancy-days: 30
    cross-channel-bene-variance-pct: 150.0
    cross-channel-bene-min-days: 3
    seasonal-deviation-variance-pct: 80.0
    seasonal-min-samples: 4
    mule-min-fan-in: 2
    mule-shared-bene-pct: 20.0
    mule-density-threshold: 0.3
    mule-composite-threshold: 25.0
    mule-graph-refresh-ms: 300000

  feedback:
    auto-accept-timeout-ms: 3600000
    auto-accept-check-interval-seconds: 60
    tuning-interval-hours: 6
    min-samples-for-tuning: 50
    weight-floor: 0.5
    weight-ceiling: 5.0
    max-adjustment-pct: 0.10

  silence-detection:
    enabled: false
    check-interval-minutes: 5
    silence-multiplier: 3.0
    min-expected-tps: 1.0
    min-completed-hours: 48

# Kafka topics
kafka:
  topics:
    txn-events: txn-events
    profile-updates: profile-updates

# Ollama LLM
ollama:
  host: ${OLLAMA_HOST:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2:1b}
  timeout-seconds: ${OLLAMA_TIMEOUT:300}

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Twilio notification
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:+14155238886}
  to-number: ${TWILIO_TO_NUMBER:+919830709527}
  enabled: ${TWILIO_ENABLED:true}
  channel: ${TWILIO_CHANNEL:whatsapp}

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# Logging
logging:
  level:
    com.bank.anomaly: INFO
    com.bank.anomaly.engine: DEBUG
    org.springframework.kafka: WARN
    liquibase: INFO
