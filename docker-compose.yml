services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-anomaly
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_pass
      APP_USER: anomaly
      APP_USER_PASSWORD: anomaly_pass
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Ollama runs natively on macOS (Metal GPU). Start with: ollama serve
  # Docker containers reach it via host.docker.internal:11434

  app:
    build: .
    container_name: anomaly-detection-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=anomaly
      - SPRING_DATASOURCE_PASSWORD=anomaly_pass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-+14155238886}
      - TWILIO_TO_NUMBER=${TWILIO_TO_NUMBER:-+919830709527}
      - TWILIO_ENABLED=${TWILIO_ENABLED:-true}
      - TWILIO_CHANNEL=${TWILIO_CHANNEL:-whatsapp}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      app:
        condition: service_started

  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    ports:
      - "3333:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    depends_on:
      prometheus:
        condition: service_started

volumes:
  oracle-data:
